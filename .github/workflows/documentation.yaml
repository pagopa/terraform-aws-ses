name: Generate terraform docs
# This workflow is the first step in the secure documentation generation process.
# It runs on pull_request (untrusted context), generates the documentation,
# and uploads it as an artifact. It DOES NOT push changes.
# The actual push is handled by the 'Push terraform docs' workflow.
on:
  - pull_request
jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    # https://github.com/actions/checkout/releases/tag/v6.0.1
    - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      with:
        ref: ${{ github.event.pull_request.head.ref }}

    - name: Render terraform docs inside the README.md
      # https://github.com/terraform-docs/gh-actions/releases/tag/v1.4.1
      uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c
      with:
        working-dir: .
        output-file: README.md
        output-method: inject

    - name: Check for changes
      id: check_changes
      run: |
        if git diff --quiet README.md; then
          echo "✨ No changes detected in README.md. Skipping artifact upload."
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "📝 Changes detected in README.md. Proceeding with artifact upload."
          echo "changed=true" >> $GITHUB_OUTPUT
        fi

    - name: Upload rendered README artifact
      if: steps.check_changes.outputs.changed == 'true'
      # https://github.com/actions/upload-artifact/releases/tag/v6.0.0
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: terraform-docs-readme
        path: README.md
